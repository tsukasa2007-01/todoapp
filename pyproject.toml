[project]
name = "todoapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tsukasa2007-01", email = "okamoto.tks01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
]

[project.scripts]
todoapp = "todoapp:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
